dataset_download: True
in_chans: 3
workers: 4

dataset: torch/cifar10
pretrained: False
num_classes: 10
input_size:
  - 3
  - 32
  - 32
crop_pct: 0.875
mean:
  - 0.4914
  - 0.4822
  - 0.4465
std:
  - 0.2470
  - 0.2435
  - 0.2616
batch_size: 128
opt: sgd
weight_decay: 1e-4
sched: cosine
lr: 0.1
epochs: 30
warmup_epochs: 0
scale: # Random resize scale, for cifar10
  - 0.75
  - 1.0
ratio: # Random resize aspect ratio
  - 0.75
  - 1.33
hflip: 0.5
color_jitter: 0.4
aug_repeats: 0
bce_loss: False
reprob: 0
mixup: 0
cutmix: 0
smoothing: 0
drop: 0
drop_path: 0
seed: 42

# Analog LRTT parameters
analog: True
lrtt_rank: 2
transfer_every: 100
transfer_lr: 1.0
lora_alpha: 1.0
validate_c_only: True

# Disable AMP and EMA for analog mode
amp: False
model_ema: False
